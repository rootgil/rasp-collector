# rasp-collector — GitLab CI Pipeline
#
# Stages:
#   typecheck     → tsc --noEmit
#   test          → vitest run
#   security-audit → npm audit (high severity gate)
#
# CI variables:
#   DATABASE_URL  (masked, optional) — real DB for integration tests only
#
# Image is SHA-pinned (E.3.2).

image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd

stages:
  - typecheck
  - test
  - security-audit

default:
  tags:
    - oriso-runner-01
  before_script:
    - node --version
    - npm config set prefix "$HOME/.local"
    - npm install -g pnpm@10 --quiet
    - export PATH="$HOME/.local/bin:$PATH"
    - pnpm --version

.only_mr_and_main: &only_mr_and_main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

typecheck:
  stage: typecheck
  <<: *only_mr_and_main
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/

test:
  stage: test
  <<: *only_mr_and_main
  needs:
    - job: typecheck
      artifacts: false
  variables:
    DATABASE_URL: "postgresql://test:test@localhost:5432/test_collector"
    NODE_ENV: test
    HMAC_REQUIRED: "false"
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days

security-audit:
  stage: security-audit
  <<: *only_mr_and_main
  allow_failure: true
  needs:
    - job: test
      artifacts: false
  script:
    - pnpm install --frozen-lockfile
    - |
      echo "=== Production dependency audit (blocking on high+) ==="
      pnpm audit --prod --audit-level=high
    - |
      echo "=== Full audit (informational) ==="
      pnpm audit --audit-level=critical || true
