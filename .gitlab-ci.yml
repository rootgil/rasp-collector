# rasp-collector — GitLab CI Pipeline
#
# Fixes vs old GitHub Actions workflow:
#   - Was: `npm ci` (no package-lock.json — repo uses pnpm)
#   - Now: `pnpm install --frozen-lockfile` (correct)
#   - ESLint config added (was missing, lint script pointed at nothing)
#
# No real DATABASE_URL needed: prisma generate only reads the schema URL,
# it does not open a connection. A placeholder is sufficient.

image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd

stages:
  - install
  - check
  - test
  - security

variables:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

default:
  tags:
    - oriso-runner-01
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - node --version && pnpm --version

# ─── Cache ────────────────────────────────────────────────────────────────────

.pnpm_cache: &pnpm_cache
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/

# ─── Rules ────────────────────────────────────────────────────────────────────

.default_rules: &default_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ─── Stage: install ───────────────────────────────────────────────────────────

install:
  stage: install
  <<: *default_rules
  <<: *pnpm_cache
  script:
    - pnpm install --frozen-lockfile
    - pnpm db:generate

# ─── Stage: check ─────────────────────────────────────────────────────────────

typecheck:
  stage: check
  <<: *default_rules
  <<: *pnpm_cache
  needs: [install]
  script:
    - pnpm typecheck

lint:
  stage: check
  <<: *default_rules
  <<: *pnpm_cache
  needs: [install]
  script:
    - pnpm lint

# ─── Stage: test ──────────────────────────────────────────────────────────────

test:
  stage: test
  <<: *default_rules
  <<: *pnpm_cache
  needs: [typecheck, lint]
  variables:
    NODE_ENV: test
  script:
    - pnpm test

# ─── Stage: security ──────────────────────────────────────────────────────────
# GitLab Security templates require Docker; shell runner uses pnpm audit instead.

security-audit:
  stage: security
  <<: *default_rules
  <<: *pnpm_cache
  needs: [install]
  allow_failure: true
  script:
    - pnpm audit --prod --audit-level=high
    - |
      echo "=== Dev dependency audit (informational) ==="
      pnpm audit --audit-level=high || true
